name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create twa-manifest.json manually
        run: |
          mkdir -p twa-project
          cat > twa-project/twa-manifest.json << 'EOF'
          {
            "packageId": "ir.dedhban.print",
            "host": "print.dedhban.ir",
            "name": "سیستم چاپ تحت شبکه",
            "launcherName": "چاپ شبکه",
            "display": "standalone",
            "themeColor": "#1a73e8",
            "navigationColor": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://print.dedhban.ir/static/icon-512.png",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "webManifestUrl": "https://print.dedhban.ir/manifest.json",
            "minSdkVersion": 19
          }
          EOF

      - name: Generate Android project
        run: |
          cd twa-project
          bubblewrap update --skipPwaValidation

      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-project/*.apk
