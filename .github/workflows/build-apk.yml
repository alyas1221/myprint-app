name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA Project
        run: |
          mkdir -p twa-project
          cd twa-project
          # پاسخ خودکار به سوالات Bubblewrap با yes
          yes | bubblewrap init --manifest https://print.dedhban.ir/manifest.json --directory . --skipPwaValidation || true

      - name: Build APK
        run: |
          cd twa-project
          # پاسخ خودکار به سوالات در مرحله build
          yes | bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-project/*.apk
